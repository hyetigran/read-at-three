name: Application checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      READING_CONTENT_MODE: fixture
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      - run: npm run content:fixture
      - run: npm run format:check
      - run: npm run validators:check
      - run: npm run migrations:check
      - run: npm run typecheck
      - run: npm run check:boundaries
      - run: npm test
      - run: npm run build
  browser:
    name: Browser checks (${{ matrix.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: development
            command: npm run test:browser
          - mode: production
            command: npm run test:browser:build
    env:
      READING_CONTENT_MODE: fixture
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      - run: npm run content:fixture
      - run: npx playwright install --with-deps chromium --only-shell
      - run: ${{ matrix.command }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: browser-failure-evidence-${{ matrix.mode }}
          path: test-results/
          retention-days: 7
  spa:
    if: always()
    needs: [checks, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: test "$CHECKS_RESULT" = success && test "$BROWSER_RESULT" = success
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
